name: Production CI/CD Pipeline (Web Portal)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows manual 1-click trigger from GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Mandatory for Organizations: Grants GITHUB_TOKEN permission to push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  lint-and-typecheck:
    name: "TypeScript Check & Linter"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run lint

      - name: Dry-Run Production Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_APP_TITLE: "PAYG VPN Portal"
          VITE_DEFAULT_LANGUAGE: "en"
          VITE_DEFAULT_CURRENCY: "IRT"
        run: npm run build

  build-and-push:
    name: "Docker Build & Push to GHCR"
    needs: [lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Converts Organization Name to strictly lowercase for Docker
      - name: Set Lowercase Image Name
        run: |
          RAW_OWNER="${{ github.repository_owner }}"
          echo "IMAGE_NAME=${RAW_OWNER,,}/vpn-web-portal" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            VITE_APP_TITLE=PAYG VPN Portal
            VITE_DEFAULT_LANGUAGE=en
            VITE_DEFAULT_CURRENCY=IRT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push Image to GHCR
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: "Deploy to Production Host"
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.FRONTEND_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Rolling Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_KEY }}
          port: ${{ secrets.FRONTEND_PORT || 22 }}
          script: |
            set -e
            cd /opt/payg-vpn/web-portal

            echo "📥 Authenticating with registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo "📦 Pulling new frontend image tag: ${{ github.sha }}..."
            docker compose pull frontend-prod

            echo "🚀 Performing rolling restart..."
            docker compose up -d --no-deps frontend-prod

            echo "🧹 Pruning dangling images..."
            docker image prune -af --filter "until=48h"